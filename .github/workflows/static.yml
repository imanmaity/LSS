  $('#swsvg').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('.nd');if(g){e.preventDefault();stop();go(+g.dataset.i)}}});
  $('#swNext').onclick=()=>{stop();go(cur+1)};$('#swPrev').onclick=()=>{stop();go(cur-1)};
