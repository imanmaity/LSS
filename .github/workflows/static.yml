   {k:'pack',nm:'Pack & dispatch',t:['Pack &','dispatch'],lane:3,sh:'para',x:610,y:420,w:150,h:90,min:16,def:'dmg',bx:598,by:468,anc:'end',
    d:{who:'Dispatch',what:'The item is packed, labelled and staged for dispatch.',steps:'As-Is steps 11, 14, 15: pack (5), label (2), stage (9) = 16 min',ev:['Staging is a 9-minute non-value-adding hotspot','Stacking / poor palletization: 74 of 299 damage cases (24.7%); inadequate packaging 9']}},
   {k:'deliver',t:['Order delivery'],lane:0,sh:'end',x:640,y:45,w:120,h:60,min:0,def:null,bx:700,by:121,
