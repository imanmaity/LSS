  const DEF={pick:['Picking errors 1.86%','--c2'],dmg:['Damage 2.29%','--c6'],inv:['Count mismatch','--pink']};
  const E=['M260 105 L260 163','M240 225 L240 273','M300 315 L338 315','M460 315 L488 315','M610 315 L638 315','M700 355 L700 418','M760 465 L830 465 L830 75 L762 75'];
  let mode='flow',cur=0,timer=null;
  const shape=(n,st)=>{const{x,y,w,h}=n;
   if(n.sh==='end')return `<rect class="sh" style="${st}" x="${x}" y="${y}" width="${w}" height="${h}" rx="30"/>`;
   if(n.sh==='proc')return `<rect class="sh" style="${st}" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/><path class="in" d="M${x+12} ${y}V${y+h}M${x+w-12} ${y}V${y+h}"/>`;
   if(n.sh==='hex')return `<polygon class="sh" style="${st}" points="${x+20},${y} ${x+w-20},${y} ${x+w},${y+h/2} ${x+w-20},${y+h} ${x+20},${y+h} ${x},${y+h/2}"/>`;
   return `<polygon class="sh" style="${st}" points="${x+28},${y} ${x+w},${y} ${x+w-28},${y+h} ${x},${y+h}"/>`};
  const label=n=>{const cx=n.x+n.w/2,cy=n.y+n.h/2,ls=n.t;
