   s+=`<rect x="50" y="20" width="750" height="510" rx="6" class="frame2"/>`;
   if(mode==='time')s+=`<g class="ghost"><rect x="318" y="379" width="300" height="19" rx="9.5"/><text x="468" y="392" text-anchor="middle">Not on diagram: steps 8–9 · 21 min</text></g>`;
   E.forEach((p,i)=>{const act=i===cur-1||i===cur;s+=`<path d="${p}" class="edge${i===cur?' act':''}" marker-end="url(#${i===cur?'arA':'ar'})"/>`});
   N.forEach((n,i)=>{let st='';const mx=Math.max(...N.map(q=>q.min));
    if(mode==='def'&&n.def)st=`fill:${css2(DEF[n.def][1])};fill-opacity:.28;stroke:${css2(DEF[n.def][1])}`;
