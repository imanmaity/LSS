{id:'cost',label:'Cost scenario',html:()=>head('At the case’s unit losses, the baseline period carried an illustrative $0.38–0.67M of defect cost','Edit the loss per incident to test the scenario. Defaults are the case’s own assumptions.')+`
 <div class="card"><div class="row" style="margin-bottom:12px">
  <label class="field">Picking error ($)<input id="lp" type="number" value="330" min="0"></label>
  <label class="field">Damaged item ($)<input id="ld" type="number" value="800" min="0"></label>
  <label class="field">Count error ($)<input id="lm" type="number" value="1100" min="0"></label>
  ${seg('basis',[['d','Mismatch = days'],['u','Mismatch = units']],'d')}</div>
  <div class="split"><div class="cv"><canvas id="cCost"></canvas></div><div id="costOut"></div></div></div>
 <div class="callout warn"><b>Scenario, not audited loss.</b> To firm this up we need cost actuals per incident, and whether one variance unit equals one loss event. Excludes implementation cost; the cause of the fall is unproven.</div>
 ${src('Define sheet (loss per incident: $330 / $800 / $1,100) × Measure and Improve counts; 61-day window each.')}`,
 init(){
  let basis='d';
  const calc=()=>{const lp=+$('#lp').value||0,ld=+$('#ld').value||0,lm=+$('#lm').value||0;
   const base=[243*lp,299*ld,(basis==='d'?57:315)*lm],imp=[16*lp,6*ld,(basis==='d'?5:21)*lm];
   const tb=base.reduce((a,b)=>a+b,0),ti=imp.reduce((a,b)=>a+b,0);
   $('#costOut').innerHTML=tbl(['Cost line','Baseline','Improve','Difference'],[['Picking',fmt(base[0]),fmt(imp[0]),fmt(base[0]-imp[0])],['Damage',fmt(base[1]),fmt(imp[1]),fmt(base[1]-imp[1])],['Mismatch ('+(basis==='d'?'days':'units')+')',fmt(base[2]),fmt(imp[2]),fmt(base[2]-imp[2])],['<b>Total</b>','<b>'+fmt(tb)+'</b>','<b>'+fmt(ti)+'</b>','<b>'+fmt(tb-ti)+'</b>']],{num:[1,2,3]})+
