{id:'ctrl',label:'Control charts',html:()=>head('Control charts: no improve-period day breaches a baseline limit, and all 61 days sit below the baseline centre line for picking, damage and inventory variance','p-charts for the two sampled defect rates and an individuals (I) chart for daily inventory variance, built from the attached workbook. The periods are four years apart; the break sits between day 61 and day 62.')+
 `<div style="display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center">${seg('ccM',[['pk','Picking error rate'],['dm','Damage rate'],['iv','Inventory variance']],'pk')}${seg('ccL',[['b','Baseline limits'],['s','Two-stage limits']],'b')}<button class="btn" id="xlsDl" style="background:var(--accent);color:var(--on-accent);margin:0 0 12px">⬇ Attached workbook (.xlsx)</button></div>
 <div class="card"><div class="cv tall"><canvas id="cCC"></canvas></div></div>
 <div class="grid g3" id="ccCards" style="margin-top:16px"></div>
 <div class="callout" id="ccNote" style="margin-top:16px"></div>
 <details class="card" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">Daily data behind the charts (122 days, from the workbook)</summary><div id="ccTbl" style="margin-top:12px"></div></details>`+
 src('Classroom_Project_3_-_Inventory_Management.xlsx, sheets Measure (1 Apr–31 May 2021) and Improve (1 Oct–30 Nov 2025), 61 days each, recomputed from the raw counts. p-chart limits: p̄ ± 3√(p̄(1−p̄)/nᵢ) with each day’s own sample size. I-chart limits: mean ± 2.66 × average moving range. Variance = |Actual − SAP|.'),
 init(){
  const c=col(),RED='#E5484D',AMB='#F5A623',NB=61,N=RAW.n.length;
  let M='pk',LM='b';
  const NAME={pk:'Picking error rate',dm:'Damage rate',iv:'Inventory variance'};
  const fv=(m,v)=>m==='iv'?v.toFixed(2)+' units':v.toFixed(2)+'%';
  const cnt=m=>m==='pk'?RAW.pk:RAW.dm;
  function build(m,mode){
   const y=m==='iv'?RAW.act.map((a,i)=>Math.abs(a-RAW.sap[i])):cnt(m).map((x,i)=>x/RAW.n[i]*100);
   const stage=(a,b)=>{
    if(m==='iv'){const v=y.slice(a,b),mean=v.reduce((s,x)=>s+x,0)/v.length;let mr=0;for(let i=1;i<v.length;i++)mr+=Math.abs(v[i]-v[i-1]);mr/=v.length-1;return ()=>[mean,mean+2.66*mr,Math.max(0,mean-2.66*mr)]}
    let C=0,T=0;for(let i=a;i<b;i++){C+=cnt(m)[i];T+=RAW.n[i]}const p=C/T;
    return i=>{const s=3*Math.sqrt(p*(1-p)/RAW.n[i]);return [p*100,(p+s)*100,Math.max(0,(p-s)*100)]}};
   const f1=stage(0,NB),f2=mode==='s'?stage(NB,N):f1,cl=[],ucl=[],lcl=[];
   for(let i=0;i<N;i++){const r=(i<NB?f1:f2)(i);cl.push(r[0]);ucl.push(r[1]);lcl.push(r[2])}
   const r1=y.map((v,i)=>v>ucl[i]||(lcl[i]>0&&v<lcl[i])),r2=Array(N).fill(false);
   if(mode==='b'){for(const [a,b] of [[0,NB],[NB,N]]){let i=a;while(i<b){const sg=Math.sign(y[i]-cl[i]);let j=i;while(sg!==0&&j+1<b&&Math.sign(y[j+1]-cl[j+1])===sg)j++;if(sg!==0&&j-i+1>=8)for(let k=i;k<=j;k++)r2[k]=true;i=j+1}}}
   return {y,cl,ucl,lcl,r1,r2};
  }
  const brk={id:'brk',afterDatasetsDraw(ch){const {ctx,chartArea:a,scales:{x}}=ch;const xm=(x.getPixelForValue(NB-1)+x.getPixelForValue(NB))/2;
   ctx.save();ctx.strokeStyle=css('--muted');ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(xm,a.top);ctx.lineTo(xm,a.bottom);ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle=css('--muted');ctx.font='600 11px Roboto,Arial,sans-serif';ctx.textAlign='right';ctx.fillText('Baseline · Apr–May 2021',xm-8,a.top+13);ctx.textAlign='left';ctx.fillText('Improve · Oct–Nov 2025',xm+8,a.top+13);ctx.restore()}};
  const gap=col0=>x=>x.p0DataIndex===NB-1?'transparent':col0;
  function draw(){
   killCharts();
   const s=build(M,LM),hasL=s.lcl.some(v=>v>0),hasR2=s.r2.some(Boolean);
   const pc=(f)=>s.y.map((_,i)=>f(i));
   const ds=[
    {label:NAME[M],data:s.y,borderColor:c.b,borderWidth:1.6,tension:0,segment:{borderColor:x=>x.p0DataIndex===NB-1?'transparent':(x.p0DataIndex>=NB?c.g:c.b)},
     pointRadius:pc(i=>s.r1[i]?5:s.r2[i]?3.5:2),pointBackgroundColor:pc(i=>s.r1[i]?RED:s.r2[i]?AMB:(i>=NB?c.g:c.b)),pointBorderColor:pc(i=>s.r1[i]?RED:s.r2[i]?AMB:(i>=NB?c.g:c.b))},
    {label:'Centre line',data:s.cl,borderColor:c.pa,borderDash:[6,4],pointRadius:0,borderWidth:2,segment:{borderColor:gap(c.pa)}},
    {label:'UCL',data:s.ucl,borderColor:c.p,borderDash:[2,3],pointRadius:0,borderWidth:2,segment:{borderColor:gap(c.p)}}];
   if(hasL)ds.push({label:'LCL',data:s.lcl,borderColor:c.gr,borderDash:[2,3],pointRadius:0,borderWidth:2,segment:{borderColor:gap(c.gr)}});
   ds.push({label:'Beyond a limit',data:[],showLine:false,backgroundColor:RED,borderColor:RED,pointRadius:5});
   if(hasR2)ds.push({label:'Run of 8+ on one side of centre line',data:[],showLine:false,backgroundColor:AMB,borderColor:AMB,pointRadius:4});
   const unit=M==='iv'?'Units (|Actual − SAP|)':'% of sampled items';
   mk('cCC',{type:'line',data:{labels:DATES,datasets:ds},plugins:[brk],options:{interaction:{mode:'index',intersect:false},
    plugins:{title:{display:true,text:NAME[M]+' · '+(M==='iv'?'I-chart':'p-chart')+' · '+(LM==='b'?'baseline limits':'two-stage limits (each period its own)')},legend:{position:'bottom'},
     tooltip:{callbacks:{title:it=>DATES[it[0].dataIndex]+(it[0].dataIndex<NB?' · baseline':' · improve'),
      label:x=>x.dataset.data.length?x.dataset.label+': '+x.parsed.y.toFixed(M==='iv'&&x.datasetIndex===0?0:2)+(M==='iv'?'':'%'):null,
      afterBody:it=>{const i=it[0].dataIndex;return M==='iv'?['Actual '+RAW.act[i]+' vs SAP '+RAW.sap[i]]:['Sampled '+RAW.n[i]+' · count '+cnt(M)[i]]}}}},
    scales:{y:{beginAtZero:true,title:{display:true,text:unit}},x:{ticks:{maxTicksLimit:8}}}}});
   cards(s);
  }
  function cards(){
   const sb=build(M,'b'),ss=build(M,'s'),y=sb.y,dts=a=>a.map(i=>DATES[i]).join(', ')||'none';
   const idx=(f,a,b)=>{const o=[];for(let i=a;i<b;i++)if(f(i))o.push(i);return o};
   const bUcl=idx(i=>sb.r1[i],0,NB),bRun=idx(i=>sb.r2[i],0,NB).length;
   const iAbove=idx(i=>y[i]>sb.cl[i],NB,N).length,iBeyond=idx(i=>sb.r1[i],NB,N).length,iOwn=idx(i=>ss.r1[i],NB,N);
   const any=M==='iv'?idx(i=>y[i]>0,NB,N).length:idx(i=>cnt(M)[i]>0,NB,N).length;
   let pk=NB;for(let i=NB;i<N;i++)if(y[i]>y[pk])pk=i;
   let mean;if(M==='iv'){mean=y.slice(NB).reduce((a,b)=>a+b,0)/NB}else{mean=cnt(M).slice(NB).reduce((a,b)=>a+b,0)/RAW.n.slice(NB).reduce((a,b)=>a+b,0)*100}
   const bm=sb.ucl.slice(0,NB).reduce((a,b)=>a+b,0)/NB;
   $('#ccCards').innerHTML=
    card('Baseline · Apr–May 2021',ul(['Centre line: <b>'+fv(M,sb.cl[0])+'</b>','UCL: <b>'+fv(M,bm)+'</b>'+(M==='iv'?'':' on average (varies with daily n)'),'Days beyond UCL: <b>'+bUcl.length+'</b> ('+dts(bUcl)+')','Points in runs of 8+ on one side of the centre line: <b>'+bRun+'</b>']),'hover')+
    card('Improve · Oct–Nov 2025',ul(['Mean: <b>'+fv(M,mean)+'</b>','Days with any '+(M==='iv'?'variance':'defect')+': <b>'+any+' of 61</b>','Peak: <b>'+fv(M,y[pk])+'</b> on '+DATES[pk],'Above baseline centre line: <b>'+iAbove+'</b> days · beyond baseline UCL: <b>'+iBeyond+'</b>','Beyond own-period UCL (two-stage): <b>'+iOwn.length+'</b> ('+dts(iOwn)+')']),'hover tint-g')+
    card('Reading',`<p>${iAbove===0&&iBeyond===0?'Every improve-period day is at or below the baseline centre line and inside the limits: a sustained downward shift, not a one-off dip.':'Some improve-period days reach the baseline centre line or limits; review them as special causes.'}</p><p>The chart shows <i>that</i> the process moved, not <i>why</i>: no log of implemented actions exists. Days beyond the improve-period UCL are the first ones to investigate.</p>`,'hover tint-p');
   $('#ccNote').innerHTML='<b>How to read:</b> red points are beyond a control limit; amber points belong to a run of 8 or more days on one side of the baseline centre line (shown on baseline limits only). '+(M==='iv'?'I-chart limits use mean ± 2.66 × average moving range; the lower limit is 0.':'The lower control limit is 0 at these volumes, so it is not drawn. At an improve-period rate near 0.1% most days record zero events, so the two-stage limits are indicative only. Re-base after 20–25 stable points.');
  }
  /* data table */
  const sP=build('pk','b'),sD=build('dm','b'),sV=build('iv','b'),pr=(k,i)=>(RAW[k][i]/RAW.n[i]*100).toFixed(2);
  const rows=[];for(let i=0;i<N;i++){const f=[sP.r1[i]&&'Picking',sD.r1[i]&&'Damage',sV.r1[i]&&'Variance'].filter(Boolean);
   rows.push([DATES[i],i<NB?'Baseline':'Improve',RAW.n[i],RAW.pk[i],pr('pk',i),RAW.dm[i],pr('dm',i),RAW.act[i],RAW.sap[i],Math.abs(RAW.act[i]-RAW.sap[i]),f.length?f.join(', '):'–'])}
  $('#ccTbl').innerHTML='<div style="max-height:360px;overflow:auto">'+tbl(['Date','Period','Sampled','Picked wrong','Pick %','Damaged','Damage %','Actual','SAP','|Var|','Beyond baseline UCL'],rows,{num:[2,3,4,5,6,7,8,9],hl:r=>r[10]!=='–'})+'</div>';
  /* download */
  $('#xlsDl').onclick=()=>{try{const b=atob(XLSX_B64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='Classroom_Project_3_-_Inventory_Management.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}catch(e){}};
  bindSeg('ccM',k=>{M=k;draw()});bindSeg('ccL',k=>{LM=k;draw()});draw();
 }},
