   const n=N[cur];s+=`<g class="tok" style="transform:translate(${n.x+n.w-6}px,${n.y+6}px)"><circle r="9"/><text y="4" text-anchor="middle">${cur+1}</text></g>`;
   $('#swsvg').innerHTML=s;
   $('#swLeg').innerHTML=mode==='def'?Object.values(DEF).map(d=>`<span><i style="background:var(${d[1]})"></i>${d[0]}</span>`).join('')+'<span>Uncoloured = no defect type mapped</span>':mode==='time'?'<span>Shading = minutes in the step (As-Is steps mapped by analyst)</span><span>Mapped total: 53 min + 21 min not shown = 74 min</span>':'<span>Rounded = start / end</span><span>Double-bar box = process</span><span>Hexagon = warehouse operation</span><span>Parallelogram = output</span>';
   const d=n.d,pct=n.min?Math.round(n.min/74*100):0;
   $('#swDet').innerHTML=`<div class="card"><h4>Step ${cur+1} of ${N.length} · ${d.who}</h4><h3 style="font-size:20px">${n.nm||n.t[0]}</h3><p>${d.what}</p><div class="mrow"><span>Maps to</span><b style="text-align:right">${d.steps}</b></div>${n.min?`<div class="mrow"><span>Share of 74-minute cycle</span><span style="display:flex;gap:8px;align-items:center;min-width:140px"><div class="bar"><i style="width:${pct/ .3>100?100:pct/.3}%"></i></div><b>${n.min} min · ${pct}%</b></span></div>`:''}<h4 style="margin-top:12px">Evidence from the DMAIC data</h4>${ul(d.ev)}${n.def?`<p>${pill(DEF[n.def][0],'p')}</p>`:''}</div>`};
  const go=i=>{cur=(i+N.length)%N.length;draw()};
  const stop=()=>{if(timer){clearInterval(timer);timer=null;$('#swPlay').textContent='▶ Play'}};
