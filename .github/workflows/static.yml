{id:'close',label:'Closure request',html:()=>head('Closure approval request (draft): an approved email is not on file')+`
 <div class="split"><div class="mail"><div class="hd"><b>To:</b> Project Sponsor, Parahouse Warehousing<br><b>Subject:</b> Project closure and control plan for approval</div>
 <p>Dear Sponsor,</p><p>Between Apr–May 2021 and Oct–Nov 2025, picking errors fell from 1.86% to 0.10%, damage from 2.29% to 0.04%, and mismatch days from 57 to 5 of 61. These are observed differences; the periods are four years apart and the actions implemented are not documented, so we do not attribute the change to specific measures.</p><p>We ask you to approve: (1) the control plan and KPI triggers, (2) numeric targets, (3) a pilot-versus-control validation of the proposed interventions, and (4) the finance data needed to quantify benefits.</p><p>Regards,<br>Project team</p></div>
 ${card('Open items before closure',`<p><span class="stamp">DRAFT</span></p>`+ul(['Log of implemented solutions','Numeric targets from the sponsor','Cost actuals from finance','Measurement-system study']),'tint-b')}</div>`+src('Drafted from the analysis. Not sent; no approval recorded.')}
]);

P('conclusion','Conclusion',[
{id:'end',label:'Takeaways',html:()=>`<div class="hero"><small>Conclusion</small><h1>Defects fell sharply; proving why, and making it last, is the next job</h1></div>
 <div class="grid g3">
  ${card('What the data shows','<p>Picking 1.86% → 0.10%, damage 2.29% → 0.04%, mismatch days 57 → 5 of 61. Two or three causes per problem explain 76–79% of errors.</p>','hover tint-g')}
  ${card('What it does not show','<p>That our actions caused the fall: periods are four years apart and no implementation log exists. Savings figures are scenarios.</p>','hover tint-p')}
  ${card('What to decide next','<p>Confirm implemented actions; set numeric targets; approve the control plan; fund the data that closes the gaps.</p>','hover tint-b')}</div>
 <div class="callout"><b>Management action plan:</b> damage and inventory accuracy first; relabel bins now; run a pilot against a control zone; track every KPI on the control charts.</div>`}
]);

P('appendix','Appendix',[
{id:'verify',label:'A · Verification',html:()=>head('Appendix A: every provisional figure in the brief was recomputed and confirmed')+
 tbl(['Provisional figure','Recomputed','Result'],[['Picking: manual 102 + labels 85 ≈ 77%','187 of 243 = 77.0%'],['Damage: leading causes ≈ 78.6%','Top three: 235 of 299 = 78.6%'],['Mismatch: leading causes ≈ 75.6%','Top three: 238 of 315 = 75.6%'],['Picking error rate 1.86%; count 243','243 ÷ 13,039 = 1.864%'],['Damage rate 2.29%; count 299','299 ÷ 13,039 = 2.293%'],['Improve picking 0.10%; count 16','16 ÷ 15,365 = 0.104%'],['Improve damage 0.04%; count 6','6 ÷ 15,365 = 0.039%'],['Mismatch days 57 → 5','57 and 5 of 61 days']].map(r=>[r[0],r[1],pill('Confirmed','g')]))+
 `<div class="callout"><b>Clarification:</b> the mismatch Pareto counts variance units (315), not mismatch days (57). Book1.xlsx sheets Sheet1, Sheet2 and RACI (hospital and school examples) belong to other projects and were not used; Sheet4 supplied the toolkit grid.</div>`+src('Measure, Improve and Analyze (2), recomputed from raw cells.')},
{id:'limits',label:'B · Limitations',html:()=>head('Appendix B: limitations and the data that would close them')+
 tbl(['Limitation','Effect on conclusions','Data or action needed'],[['Periods four years apart (2021 vs 2025)','Observed change cannot be attributed to our actions','Pilot-versus-control run on contemporaneous data'],['No log of implemented solutions','Cannot link effect to action','Implementation record with dates and zones'],['Rates per sampled item; costs per order','Order-level defect rate unknown','Orders and lines per day; order IDs on defects'],['Picking errors track sample size (r = 0.96)','Recording method may be derived','Check recording procedure; independent audit'],['No measurement-system study','Repeatability of counts untested','Attribute agreement study'],['Unit losses are case assumptions','Costs are scenarios','Finance actuals per incident'],['Few events in Improve period (6–21)','Sigma estimates imprecise','Longer post-period; re-base control limits']])+src('Analyst review of all sheets.')}
]);

/* ---------- router ---------- */
let pi=0,ti=0;
const flat=[];PAGES.forEach((p,a)=>p.tabs.forEach((t,b)=>flat.push([a,b])));
function renderNav(){
  $('#phases').innerHTML=PAGES.map((p,i)=>`<button class="chip${i===pi?' on':''}" data-i="${i}">${p.label}</button>`).join('');
  $('#tabs').innerHTML=PAGES[pi].tabs.map((t,i)=>`<button class="tab${i===ti?' on':''}" role="tab" data-i="${i}">${t.label}</button>`).join('');
  $('#pageLabel').textContent=PAGES[pi].label;
  const k=flat.findIndex(f=>f[0]===pi&&f[1]===ti);
  $('#prog').style.width=((k+1)/flat.length*100)+'%';
  $('#prevBtn').disabled=k===0;$('#nextBtn').disabled=k===flat.length-1;
}
function show(a,b,push=true){
  pi=a;ti=b;killCharts();renderNav();
  const t=PAGES[pi].tabs[ti],p=$('#panel');
  p.style.animation='none';p.offsetHeight;p.style.animation='';
  p.innerHTML=t.html();
  if(t.init)t.init();
  if(push)try{history.replaceState(null,'','#'+PAGES[pi].id+'/'+t.id)}catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function step(d){const k=flat.findIndex(f=>f[0]===pi&&f[1]===ti)+d;if(k>=0&&k<flat.length)show(...flat[k])}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,.chip,.tab');
  if(b&&(b.matches('.chip,.tab,.seg button,.fab button,.iconbtn'))){const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)}
  const c=e.target.closest('.chip');if(c){show(+c.dataset.i,0);return}
  const t=e.target.closest('.tab');if(t){show(pi,+t.dataset.i);return}
  const th=e.target.closest('.sortable th');
  if(th){const tb=th.closest('table'),i=[...th.parentNode.children].indexOf(th),asc=!th.classList.contains('asc');
   tb.querySelectorAll('th').forEach(x=>x.classList.remove('asc','desc'));th.classList.add(asc?'asc':'desc');
   const rows=[...tb.tBodies[0].rows],v=r=>r.cells[i].textContent.trim(),n=s=>parseFloat(s.replace(/[^0-9.\-]/g,''));
   rows.sort((a,b)=>{const x=v(a),y=v(b),nx=n(x),ny=n(y);const r=(!isNaN(nx)&&!isNaN(ny))?nx-ny:x.localeCompare(y);return asc?r:-r});
   rows.forEach(r=>tb.tBodies[0].appendChild(r))}
});
$('#prevBtn').onclick=()=>step(-1);$('#nextBtn').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
$('#themeBtn').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}show(pi,ti,false)};
try{const s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s}catch(e){}
(function(){let a=0,b=0;const h=(location.hash||'').slice(1).split('/');const x=PAGES.findIndex(p=>p.id===h[0]);if(x>=0){a=x;const y=PAGES[x].tabs.findIndex(t=>t.id===h[1]);if(y>=0)b=y}show(a,b,false)})();
</script>
</body>
</html>
