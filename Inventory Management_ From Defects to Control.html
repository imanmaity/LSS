<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory Management: From Defects to Control · Iman Maity</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --kb:#00338D;--dark:#0C233C;--cobalt:#1E49E2;--pacific:#00B8F5;--lblue:#ACEAFF;--purple:#7213EA;--green:#098E7E;--pink:#FD349C;
  --bg:#F2F5FA;--surface:#FFFFFF;--surface2:#E9EFFA;--text:#0C233C;--muted:#566377;--line:#E1E6EE;
  --accent:#00338D;--accent-text:#00338D;--on-accent:#FFFFFF;
  --c1:#00338D;--c2:#7213EA;--c3:#098E7E;--c4:#00B8F5;--c5:#989898;--c6:#1E49E2;
  --tint-g:#E3F6F3;--tint-p:#F0E8FD;--tint-b:#E8EEFD;--tint-n:#EEF1F5;
  --e1:0 1px 2px rgba(12,35,60,.12),0 1px 3px rgba(12,35,60,.10);
  --e2:0 2px 6px rgba(12,35,60,.14),0 4px 12px rgba(12,35,60,.08);
  --e3:0 6px 16px rgba(12,35,60,.18),0 12px 32px rgba(12,35,60,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071220;--surface:#0E2036;--surface2:#15304F;--text:#E8EEF7;--muted:#9DAEC4;--line:#223A58;
    --accent:#1E49E2;--accent-text:#76D2FF;--on-accent:#fff;
    --c1:#5B8CFF;--c2:#A66BFF;--c3:#2ED3BE;--c4:#00B8F5;--c5:#7C8CA3;--c6:#76D2FF;
    --tint-g:#0F3A3A;--tint-p:#2A1A52;--tint-b:#14295C;--tint-n:#16283F;
    --e1:0 1px 2px rgba(0,0,0,.5);--e2:0 2px 8px rgba(0,0,0,.5);--e3:0 8px 24px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#071220;--surface:#0E2036;--surface2:#15304F;--text:#E8EEF7;--muted:#9DAEC4;--line:#223A58;
  --accent:#1E49E2;--accent-text:#76D2FF;--on-accent:#fff;
  --c1:#5B8CFF;--c2:#A66BFF;--c3:#2ED3BE;--c4:#00B8F5;--c5:#7C8CA3;--c6:#76D2FF;
  --tint-g:#0F3A3A;--tint-p:#2A1A52;--tint-b:#14295C;--tint-n:#16283F;
  --e1:0 1px 2px rgba(0,0,0,.5);--e2:0 2px 8px rgba(0,0,0,.5);--e3:0 8px 24px rgba(0,0,0,.6);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--kb);color:#fff;box-shadow:var(--e2)}
:root[data-theme="dark"] .appbar{background:#0A1B31}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .appbar{background:#0A1B31}}
.bar1{display:flex;align-items:center;gap:12px;padding:10px 20px}
.logo{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--kb);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;flex:none}
.bar1 h1{margin:0;font-size:17px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar1 small{display:block;font-size:11px;opacity:.75;font-weight:400;letter-spacing:.4px;text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;position:relative;overflow:hidden}
.iconbtn:hover{background:rgba(255,255,255,.14)}
.phases{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.phases::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;position:relative;overflow:hidden;transition:background .2s}
.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{background:#fff;color:var(--kb);border-color:#fff}
.progress{height:3px;background:rgba(255,255,255,.2)}
.progress i{display:block;height:100%;width:0;background:var(--pacific);transition:width .35s}
/* layout */
main{max-width:1240px;margin:0 auto;padding:22px 20px 110px}
.pagehead h2{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-text)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:8px 0 18px;scrollbar-width:thin}
.tab{flex:none;background:none;border:0;padding:12px 16px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;position:relative;overflow:hidden;white-space:nowrap}
.tab:hover{background:var(--surface2)}
.tab.on{color:var(--accent-text)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent-text)}
.headline{font-size:clamp(20px,2.6vw,28px);line-height:1.25;font-weight:700;margin:0 0 6px;color:var(--text);max-width:980px}
.lede{color:var(--muted);margin:0 0 18px;max-width:900px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--e1);padding:18px 20px;transition:box-shadow .2s,transform .2s;min-width:0}
.card.hover:hover{box-shadow:var(--e3);transform:translateY(-2px)}
.card h3{margin:0 0 8px;font-size:16px;font-weight:700}
.card h4{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.card ul{margin:6px 0 0;padding-left:18px}.card li{margin:4px 0}
.card p{margin:6px 0}
.tint-g{background:var(--tint-g)}.tint-p{background:var(--tint-p)}.tint-b{background:var(--tint-b)}.tint-n{background:var(--tint-n)}
.callout{border-radius:12px;padding:14px 18px;margin-top:16px;background:var(--tint-b);border:1px solid var(--line)}
.callout.warn{background:var(--tint-p)}
.src{font-size:12px;color:var(--muted);margin-top:14px}
.big{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.5px;color:var(--accent-text)}
.big.p{color:var(--c2)}.big.g{color:var(--c3)}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:6px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.g{background:var(--tint-g);color:var(--c3)}.pill.p{background:var(--tint-p);color:var(--c2)}.pill.b{background:var(--tint-b);color:var(--accent-text)}.pill.n{background:var(--tint-n);color:var(--muted)}
/* controls */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);margin:0 0 12px}
.seg button{border:0;background:none;padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;position:relative;overflow:hidden;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input[type=range]{accent-color:var(--accent-text);width:min(100%,320px)}
.field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.field input{font:inherit;font-size:16px;font-weight:500;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);width:130px}
.field input:focus{outline:2px solid var(--accent-text);outline-offset:0}
/* tables */
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
.t th{background:var(--kb);color:#fff;text-align:left;font-weight:500;padding:10px 12px;position:sticky;top:0;white-space:nowrap}
:root[data-theme="dark"] .t th{background:#16396B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t th{background:#16396B}}
.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.t tr:nth-child(even) td{background:color-mix(in srgb,var(--surface2) 45%,transparent)}
.t tbody tr:hover td{background:var(--surface2)}
.t .n{text-align:right;font-variant-numeric:tabular-nums}
.sortable th{cursor:pointer;user-select:none}.sortable th:hover{filter:brightness(1.15)}
.sortable th.asc::after{content:" ▲";font-size:10px}.sortable th.desc::after{content:" ▼";font-size:10px}
.t tr.hl td{background:var(--tint-b);font-weight:500}
/* process flow */
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.step{border-radius:12px;padding:10px 12px;color:#fff;box-shadow:var(--e1);transition:opacity .25s,transform .2s,box-shadow .2s;cursor:default}
.step:hover{transform:translateY(-2px);box-shadow:var(--e3)}
.step b{display:block;font-size:20px;line-height:1.1}.step span{font-size:12.5px;opacity:.95}
.step.va{background:var(--green)}.step.ve{background:#7C8CA3}.step.nva{background:var(--purple)}
.step.dim{opacity:.18}.step.hot{outline:3px solid var(--pacific);outline-offset:1px}
/* accordion */
details.acc{background:var(--surface);border-radius:12px;box-shadow:var(--e1);margin-bottom:10px;overflow:hidden}
details.acc summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;align-items:center;gap:12px;font-weight:500}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"▾";margin-left:auto;transition:transform .2s;color:var(--muted)}
details.acc[open] summary::after{transform:rotate(180deg)}
details.acc .in{padding:0 18px 14px}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;min-width:80px;flex:1}.bar i{display:block;height:100%;background:var(--c1);border-radius:4px}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
/* matrix */
.mx{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px}
.mx .ax{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:4px}
.mx .axh{text-align:center;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.cell{border-radius:12px;padding:14px;min-height:150px}
.cell b{display:block;margin-bottom:2px}.cell em{font-size:12px;color:var(--muted);font-style:normal;display:block;margin-bottom:8px}
.tag{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--e1);font-size:12.5px;transition:transform .15s}
.tag:hover{transform:scale(1.06)}
/* stepper */
.stepper{display:flex;flex-direction:column;gap:0}
.st{display:flex;gap:14px;padding:10px 0;position:relative}
.st .dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px;z-index:1}
.st:not(:last-child)::before{content:"";position:absolute;left:14px;top:40px;bottom:-10px;width:2px;background:var(--line)}
.st small{color:var(--muted);display:block}
/* email */
.mail{background:var(--surface);border-radius:14px;box-shadow:var(--e2);padding:20px 24px;font-size:14.5px}
.mail .hd{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px;color:var(--muted)}
.mail .hd b{color:var(--text)}
.stamp{display:inline-block;padding:3px 12px;border:2px solid var(--c2);color:var(--c2);border-radius:6px;font-weight:700;letter-spacing:2px;font-size:12px;transform:rotate(-3deg)}
/* fab + ripple */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:10px}
.fab button{border:0;border-radius:16px;height:52px;padding:0 20px;background:var(--accent);color:var(--on-accent);font-weight:500;font-size:14px;cursor:pointer;box-shadow:var(--e3);position:relative;overflow:hidden;display:flex;align-items:center;gap:8px}
.fab button.sec{background:var(--surface);color:var(--accent-text)}
.fab button:disabled{opacity:.4;cursor:default}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.panel{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cv{position:relative;height:340px}.cv.tall{height:440px}.cv.sm{height:260px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hero{background:linear-gradient(135deg,#00338D 0%,#1E49E2 100%);color:#fff;border-radius:18px;padding:26px 28px;box-shadow:var(--e3);margin-bottom:18px}
.hero small{letter-spacing:1.4px;font-weight:700;text-transform:uppercase;color:var(--lblue);font-size:12px}
.hero h1{margin:8px 0 8px;font-size:clamp(26px,4vw,40px);line-height:1.15}
.hero p{margin:0;max-width:760px;color:#DCE6FF}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--accent-text);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;position:relative;overflow:hidden;margin:0 0 12px;box-shadow:var(--e1)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:hover{box-shadow:var(--e2)}
.swwrap{overflow-x:auto}.swwrap svg{width:100%;min-width:640px;height:auto;display:block}
#swsvg text{fill:var(--text);font-family:Roboto,"Segoe UI",Arial,sans-serif}
#swsvg .frame{fill:var(--surface);stroke:none}#swsvg .frame2{fill:none;stroke:var(--c1);stroke-width:1.5}
#swsvg .lane.l0{fill:var(--surface)}#swsvg .lane.l1{fill:var(--tint-n)}
#swsvg .lane{stroke:var(--line);stroke-width:1}
#swsvg .lanehd{fill:var(--tint-b);stroke:var(--line)}
#swsvg .lt{font-size:12px;font-weight:700;fill:var(--accent-text)}
#swsvg .nd{cursor:pointer;outline:none}
#swsvg .nd .sh{fill:var(--surface);stroke:var(--c1);stroke-width:1.5;transition:stroke-width .15s}
#swsvg .nd.end .sh{fill:var(--tint-g);stroke:var(--c3)}
#swsvg .nd:hover .sh,#swsvg .nd:focus-visible .sh{stroke-width:3}
#swsvg .nd.sel .sh{stroke:var(--accent-text);stroke-width:3.5}
#swsvg .nd.sel{filter:drop-shadow(0 3px 6px rgba(0,51,141,.35))}
#swsvg .in{stroke:var(--c1);stroke-width:1.2;fill:none}
#swsvg .ttl{font-size:13px;font-weight:700}#swsvg .sub{font-size:10.5px;fill:var(--muted)}
#swsvg .bd{font-size:11px;font-weight:700;fill:var(--accent-text)}
#swsvg .edge{fill:none;stroke:var(--muted);stroke-width:1.8}
#swsvg .edge.act{stroke:var(--accent-text);stroke-width:2.6;stroke-dasharray:7 5;animation:dash .7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
#swsvg .arh{fill:var(--muted)}#swsvg .arA{fill:var(--accent-text)}
#swsvg .ghost rect{fill:var(--tint-p);stroke:var(--c2);stroke-dasharray:5 4}
#swsvg .ghost text{font-size:11.5px;font-weight:700;fill:var(--c2)}
#swsvg .tok{transition:transform .6s cubic-bezier(.3,.7,.3,1)}
#swsvg .tok circle{fill:var(--c2);stroke:#fff;stroke-width:2}
#swsvg .tok text{fill:#fff;font-size:10px;font-weight:700}

/* ---------- intro / about page ---------- */
.intro{position:relative;overflow:hidden;background:linear-gradient(135deg,#00338D 0%,#1E49E2 60%,#7213EA 120%);color:#fff;border-radius:20px;padding:30px 28px;box-shadow:var(--e3);margin-bottom:18px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.intro::before,.intro::after{content:"";position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(0,184,245,.35),transparent 70%);animation:floaty 9s ease-in-out infinite}
.intro::before{width:320px;height:320px;right:-80px;top:-120px}
.intro::after{width:240px;height:240px;left:30%;bottom:-140px;animation-delay:-4s;background:radial-gradient(circle,rgba(253,52,156,.28),transparent 70%)}
@keyframes floaty{50%{transform:translate(-18px,14px) scale(1.08)}}
.avatar{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:46px;font-weight:700;letter-spacing:1px;color:#fff;background:linear-gradient(145deg,#00B8F5,#7213EA);border:4px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer;user-select:none;transition:transform .25s;z-index:1}
.avatar:hover{transform:rotate(-6deg) scale(1.06)}
.avatar::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.intro .who{position:relative;z-index:1;min-width:0}
.intro small{letter-spacing:1.4px;font-weight:700;text-transform:uppercase;color:var(--lblue);font-size:12px}
.intro h1{margin:6px 0 4px;font-size:clamp(28px,5vw,46px);line-height:1.1}
.intro .hi{color:var(--lblue);font-weight:500}
.intro .typed{font-size:clamp(15px,2vw,19px);min-height:1.6em;color:#E6EEFF}
.intro .typed::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--pacific);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.intro p.note{margin:12px 0 0;max-width:640px;color:#DCE6FF}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{font:inherit;font-weight:500;font-size:14px;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;position:relative;overflow:hidden;background:#fff;color:var(--kb);box-shadow:var(--e1);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--e2)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5)}
.contact{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);position:relative}
.contact .ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;transition:transform .25s}
.contact:hover .ico{transform:rotate(-8deg) scale(1.1)}
.contact .ico.li{background:#0A66C2}.contact .ico.gh{background:#24292F}.contact .ico.em{background:var(--pink)}
.contact b{display:block;font-size:15px}
.contact span.v{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.contact .cp{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface2);color:var(--accent-text);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:500;cursor:pointer}
.contact .cp:hover{background:var(--accent);color:var(--on-accent)}
.phgo{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.phgo button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:500;box-shadow:var(--e1);transition:transform .15s,box-shadow .2s,background .2s;position:relative;overflow:hidden}
.phgo button:hover{transform:translateY(-3px);box-shadow:var(--e3);background:var(--tint-b)}
.phgo button i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700}

/* ---------- router ---------- */
let pi=0,ti=0;
const flat=[];PAGES.forEach((p,a)=>p.tabs.forEach((t,b)=>flat.push([a,b])));
function renderNav(){
  $('#phases').innerHTML=PAGES.map((p,i)=>`<button class="chip${i===pi?' on':''}" data-i="${i}">${p.label}</button>`).join('');
  $('#tabs').innerHTML=PAGES[pi].tabs.map((t,i)=>`<button class="tab${i===ti?' on':''}" role="tab" data-i="${i}">${t.label}</button>`).join('');
  $('#pageLabel').textContent=PAGES[pi].label;
  const k=flat.findIndex(f=>f[0]===pi&&f[1]===ti);
  $('#prog').style.width=((k+1)/flat.length*100)+'%';
  $('#prevBtn').disabled=k===0;$('#nextBtn').disabled=k===flat.length-1;
}
function show(a,b,push=true){
  pi=a;ti=b;killCharts();renderNav();
  const t=PAGES[pi].tabs[ti],p=$('#panel');
  p.style.animation='none';p.offsetHeight;p.style.animation='';
  p.innerHTML=t.html();
  if(t.init)t.init();
  if(push)try{history.replaceState(null,'','#'+PAGES[pi].id+'/'+t.id)}catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function step(d){const k=flat.findIndex(f=>f[0]===pi&&f[1]===ti)+d;if(k>=0&&k<flat.length)show(...flat[k])}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,.chip,.tab');
  if(b&&(b.matches('.chip,.tab,.seg button,.fab button,.iconbtn'))){const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)}
  const c=e.target.closest('.chip');if(c){show(+c.dataset.i,0);return}
  const t=e.target.closest('.tab');if(t){show(pi,+t.dataset.i);return}
  const th=e.target.closest('.sortable th');
  if(th){const tb=th.closest('table'),i=[...th.parentNode.children].indexOf(th),asc=!th.classList.contains('asc');
   tb.querySelectorAll('th').forEach(x=>x.classList.remove('asc','desc'));th.classList.add(asc?'asc':'desc');
   const rows=[...tb.tBodies[0].rows],v=r=>r.cells[i].textContent.trim(),n=s=>parseFloat(s.replace(/[^0-9.\-]/g,''));
   rows.sort((a,b)=>{const x=v(a),y=v(b),nx=n(x),ny=n(y);const r=(!isNaN(nx)&&!isNaN(ny))?nx-ny:x.localeCompare(y);return asc?r:-r});
   rows.forEach(r=>tb.tBodies[0].appendChild(r))}
});
$('#prevBtn').onclick=()=>step(-1);$('#nextBtn').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
$('#themeBtn').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}show(pi,ti,false)};
try{const s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s}catch(e){}
(function(){let a=0,b=0;const h=(location.hash||'').slice(1).split('/');const x=PAGES.findIndex(p=>p.id===h[0]);if(x>=0){a=x;const y=PAGES[x].tabs.findIndex(t=>t.id===h[1]);if(y>=0)b=y}show(a,b,false)})();
</script>
